<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📚</text></svg>" />
    <title>Thư viện lớp AIoT</title>
    <link rel="stylesheet" href="/src/style.css" />
    <script>
      // Đặt chế độ sáng/tối ngay từ đầu để trang không bị nháy trắng khi tải lại
      try {
        const saved = localStorage.getItem("theme");
        const dark = saved ? saved === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.dataset.theme = dark ? "dark" : "light";
      } catch {}
    </script>
  </head>
  <body>
    <header class="site-header">
      <div class="container header-inner">
        <h1>📚 Thư viện lớp AIoT</h1>
        <div class="header-right">
          <p class="fav-count">❤ Yêu thích: <strong id="fav-count">0</strong></p>
          <button type="button" id="theme-toggle" class="btn btn-outline">🌙 Bật chế độ tối</button>
        </div>
      </div>
    </header>

    <main class="container">
      <section class="toolbar" aria-label="Tìm kiếm và lọc sách">
        <div class="field">
          <label for="search">Tìm theo tên sách</label>
          <input type="search" id="search" placeholder="Nhập tên sách..." autocomplete="off" />
        </div>
        <div class="field">
          <label for="genre-filter">Thể loại</label>
          <select id="genre-filter">
            <option value="">Tất cả thể loại</option>
          </select>
        </div>
      </section>

      <p id="status" class="status" role="status">Đang tải…</p>

      <section aria-label="Danh sách sách">
        <div id="book-list" class="book-list"></div>
      </section>

      <section class="add-book" aria-labelledby="add-title">
        <h2 id="add-title">Thêm sách mới</h2>
        <form id="book-form" novalidate>
          <div class="form-row">
            <div class="field">
              <label for="title">Tên sách</label>
              <input type="text" id="title" name="title" placeholder="Ít nhất 3 ký tự" />
              <small class="error" id="title-error"></small>
            </div>
            <div class="field">
              <label for="author">Tác giả</label>
              <input type="text" id="author" name="author" />
              <small class="error" id="author-error"></small>
            </div>
          </div>
          <div class="form-row">
            <div class="field">
              <label for="genre">Thể loại</label>
              <select id="genre" name="genre">
                <option value="">-- Chọn thể loại --</option>
              </select>
              <small class="error" id="genre-error"></small>
            </div>
            <div class="field">
              <label for="year">Năm xuất bản</label>
              <input type="number" id="year" name="year" />
              <small class="error" id="year-error"></small>
            </div>
          </div>
          <button type="submit" class="btn btn-primary">Thêm sách</button>
          <p id="form-message" class="form-message" role="status"></p>
        </form>
      </section>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
